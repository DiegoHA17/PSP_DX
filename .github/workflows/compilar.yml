# Compila y prueba los proyectos Gradle de consola en cada Pull Request
# y en cada push a main. Para añadir una unidad nueva, añade su proyecto
# a la matriz "proyecto".
name: Compilar prácticas de consola

on:
  pull_request:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  wrapper:
    name: Validar Gradle Wrapper
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: gradle/actions/wrapper-validation@v6

  consola:
    name: ${{ matrix.proyecto }}
    needs: wrapper
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        proyecto:
          - UT1/procesos
    defaults:
      run:
        working-directory: ${{ matrix.proyecto }}
    steps:
      - uses: actions/checkout@v7

      - uses: actions/setup-java@v6
        with:
          distribution: temurin
          java-version: "21"
          cache: gradle
          cache-dependency-path: |
            ${{ matrix.proyecto }}/*.gradle.kts
            ${{ matrix.proyecto }}/gradle/wrapper/gradle-wrapper.properties

      # build = compilar + ejecutar los tests que existan
      - name: Compilar y ejecutar tests
        run: ./gradlew build --no-daemon
