# Compila el proyecto Android de la UT1 y ejecuta sus tests unitarios.
# Se lanza en los Pull Requests que modifican el proyecto Android (o este
# workflow) y a mano desde la pestaña Actions. Validado en GitHub con la
# ejecución manual 45291502586. Para un proyecto Android de otra unidad,
# añade su ruta a "paths" y un job como este.
name: Compilar Android

on:
  pull_request:
    paths:
      - "UT1/ServicioPSP/**"
      - ".github/workflows/android.yml"
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  servicio-psp:
    name: UT1/ServicioPSP
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: UT1/ServicioPSP
    steps:
      - uses: actions/checkout@v7

      - uses: actions/setup-java@v6
        with:
          distribution: temurin
          java-version: "21"
          cache: gradle
          cache-dependency-path: |
            UT1/ServicioPSP/**/*.gradle.kts
            UT1/ServicioPSP/gradle/libs.versions.toml
            UT1/ServicioPSP/gradle/wrapper/gradle-wrapper.properties

      - name: Compilar APK de depuración y ejecutar tests unitarios
        run: ./gradlew assembleDebug testDebugUnitTest --no-daemon
